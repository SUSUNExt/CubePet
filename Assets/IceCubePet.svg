<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <linearGradient id="ice" x1="196" y1="182" x2="1028" y2="1084" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9FDFF"/>
      <stop offset=".43" stop-color="#9AE5F4"/>
      <stop offset="1" stop-color="#48A9D4"/>
    </linearGradient>
    <linearGradient id="side" x1="811" y1="256" x2="1012" y2="957" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82D7EE"/>
      <stop offset="1" stop-color="#3388BF"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A5EAF7"/>
      <stop offset="1" stop-color="#4AA5CF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="19"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- soft ground shadow within the transparent canvas -->
