  <path d="M988 590c81 17 137 77 125 125-11 45-59 42-102 7l-82-66" fill="none" stroke="#2B82AF" stroke-width="56" stroke-linecap="round"/>
  <path d="M992 585c68 15 107 58 101 94-5 26-33 28-71 3l-74-57" fill="none" stroke="#A7ECF7" stroke-width="27" stroke-linecap="round"/>
